allowBuilds:
  esbuild: true
  lightningcss: true
  better-sqlite3: true
minimumReleaseAgeExclude:
  - "@tanstack/db@0.15.1"
  - "@tanstack/query-db-collection@1.4.7"
  - "@tanstack/react-db@0.5.11"
onlyBuiltDependencies:
  - esbuild
  - lightningcss
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
